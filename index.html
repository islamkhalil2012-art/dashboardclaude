<title>ميزانيتي - تطبيق الأسرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* نفس الـ style السابق مع إضافة زر التثبيت */
  :root { /* ... كل المتغيرات كما هي ... */ }
  /* ... باقي الـ style مطابق للنسخة السابقة ... */
  .install-btn {
    background: linear-gradient(135deg, var(--a1), var(--gd));
    border: none;
    border-radius: 30px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    display: none;
    margin-right: 8px;
  }
  .install-btn.show { display: inline-block; }
  @media (max-width: 480px) {
    .install-btn { padding: 4px 10px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div><h1>ميزانيتي</h1><p>أسرة إسلام ونهي وميرا ومحمد وخليل</p></div>
  </div>
  <div style="display: flex; gap: 5px; align-items: center;">
    <button class="install-btn" id="installBtn" onclick="installApp()">📲 تثبيت</button>
    <div class="date-badge" id="dateBadge"></div>
  </div>
</div>

<!-- نفس محتوى الصفحة السابق بالكامل (stats, voice, layout, reports) -->
<!-- ... أنسخ هنا نفس هيكل HTML من النسخة السابقة ... -->
<div class="stats">...</div>
<div class="voice-card">...</div>
<div class="layout">...</div>
<div class="compare-card">...</div>
<div class="month-card">...</div>
<div class="budget-card">...</div>
<div class="vqa-card">...</div>
<div id="toast" class="toast"></div>

<script>
  // ... كل الـ JavaScript السابق ...
  // ثم أضف كود PWA و service worker في نهاية الـ script

  // PWA Installation
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').classList.add('show');
  });
  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('installBtn').classList.remove('show'); });
    }
  }
  window.addEventListener('appinstalled', () => {
    document.getElementById('installBtn').classList.remove('show');
    showToast('✅ تم تثبيت التطبيق بنجاح');
  });

  // Service Worker لتخزين الملفات مؤقتاً (Cache)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(() => console.log('SW registered')).catch(e => console.log('SW error', e));
    // إنشاء سيرفيس ووركر ديناميكياً (لأننا لا نستطيع رفع ملف منفصل)
    const swCode = `const CACHE='mizan-v1'; self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])))}); self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});`;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(e=>console.log(e));
  }
</script>
</body>
</html>
